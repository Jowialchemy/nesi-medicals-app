<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nesi Medicals | Business Management</title>

    <meta
        name="description"
        content="Nesi Medicals & Minimart Enterprises Business Management System."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #071c18,
                    #102522,
                    #111827
                );

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: #1c1c1c;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 24px;

            padding: 45px 30px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.45);
        }

        .logo {
            width: 110px;
            height: 110px;

            object-fit: contain;

            margin-bottom: 20px;

            border-radius: 15px;
        }

        h1 {
            font-size: 30px;
            color: #4ade80;

            margin-bottom: 6px;
        }

        h2 {
            font-size: 17px;
            color: #b9ddff;

            margin-bottom: 15px;
        }

        .tagline {
            color: #70e0d5;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .description {
            color: #a1a1aa;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .button {
            display: inline-block;

            width: 100%;

            padding: 15px;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #0f766e
                );

            color: #ffffff;

            text-decoration: none;

            font-size: 15px;

            font-weight: 800;

            transition: 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(22,163,74,0.30);
        }

        .footer {
            margin-top: 25px;

            color: #71717a;

            font-size: 11px;

            line-height: 1.7;
        }

        .footer strong {
            color: #9ca3af;
        }

        @media (max-width: 500px) {

            .card {
                padding: 35px 22px;
            }

            .logo {
                width: 90px;
                height: 90px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <img
                src="images/logo.png"
                alt="Nesi Medicals Logo"
                class="logo"
            >

            <h1>
                Nesi Medicals
            </h1>

            <h2>
                & Minimart Enterprises
            </h2>

            <p class="tagline">
                Quality Care. Essential Products.<br>
                Trusted Service.
            </p>

            <p class="description">
                Welcome to the Nesi Medicals Business Management System.
            </p>

            <a
                href="login.html"
                class="button"
            >
                Login to Dashboard
            </a>

            <div class="footer">

                <strong>
                    Nesi Medicals & Minimart Enterprises
                </strong>

                <br>

                RC No. 9479689

                <br>

                Abuja, FCT, Nigeria

            </div>

        </div>

    </div>

</body>
</html>
